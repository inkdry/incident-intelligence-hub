name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore IncidentIntelligenceHub.slnx

      - name: Build solution
        run: >
          dotnet build IncidentIntelligenceHub.slnx
          --configuration Release
          --no-restore

      - name: Run automated tests
        run: >
          dotnet test
          --solution IncidentIntelligenceHub.slnx
          --configuration Release
          --no-build
          --verbosity normal